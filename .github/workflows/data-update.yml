name: DailyInfo data update (disabled until approved)

on:
  # Inert until DATA_SCHEDULE_ENABLED is explicitly true; manual runs are independent.
  schedule:
    - cron: '17 0-15 * * *' # 08:17–23:17 Asia/Taipei; due uses actual Taipei execution time.
  workflow_dispatch:
    inputs:
      source:
        description: Source to update (four sources; manual runs bypass due checks)
        type: choice
        options: [all, core, quotes, news, earthquakes, horoscope, checkpoint]
        default: all
      checkpoint_run:
        description: Approved checkpoint run ID (required only for checkpoint publication)
        type: string
        default: ''
      initialize_state:
        description: First run only - approve validated repository snapshots as baseline
        type: boolean
        default: false
      publish_current:
        description: Rebuild unchanged snapshots (first approved deployment or recovery)
        type: boolean
        default: false
      initialize_manifest:
        description: Explicit first-manifest adoption only (checkpoint source, no data refresh)
        type: boolean
        default: false
      baseline_approval:
        description: SHA-256 of compact reviewed release-baseline JSON (first adoption only)
        type: string
        default: ''

permissions:
  contents: read

# Opt-in only; the configuration is never written by this workflow.
env:
  SCHEDULE_MODE: ${{ vars.DATA_SCHEDULE_MODE }}
  D4_CONFIG: ${{ vars.DATA_SCHEDULE_MODE == 'd4' && vars.DATA_D4_ONCE || '' }}
  SCHEDULE_CRON: ${{ github.event.schedule }}
  AUTOMATION: ${{ vars.DATA_AUTOMATION_ENABLED }}
  SCHEDULE: ${{ vars.DATA_SCHEDULE_ENABLED }}
  FREE: ${{ vars.DATA_FREE_USAGE_CONFIRMED }}
  PUBLISH: ${{ vars.DATA_PUBLISH_ENABLED }}
  AUTO_PUBLISH: ${{ vars.DATA_AUTO_PUBLISH_ENABLED }}
  DEPLOY_TARGET: ${{ vars.DATA_DEPLOY_TARGET }}
  INITIALIZE_MANIFEST: ${{ inputs.initialize_manifest }}
  BASELINE_APPROVAL: ${{ inputs.baseline_approval }}
  CHECKPOINT_ONLY: ${{ inputs.source == 'checkpoint' }}
  INITIALIZE_STATE: ${{ inputs.initialize_state }}
  PUBLISH_CURRENT: ${{ inputs.publish_current }}
  APPROVED_CHECKPOINT_RUN: ${{ inputs.checkpoint_run }}

concurrency:
  # Shared by all production workflows, across restore, guard and deployment.
  group: dailyinfo-production
  cancel-in-progress: false

jobs:
  update:
    # No cloud action runs until the user deliberately opts in on the default branch.
    if: github.event.repository.visibility == 'public' && vars.DATA_AUTOMATION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && vars.DATA_FREE_USAGE_CONFIRMED == 'true' && vars.DATA_SCHEDULE_ENABLED == 'true' && fromJSON(vars.DATA_SCHEDULE_ENABLED || 'false') == true && ((vars.DATA_SCHEDULE_MODE == 'd4' && github.event.schedule == '43 12 * * *' && vars.DATA_D4_ONCE != '') || (vars.DATA_SCHEDULE_MODE == 'continuous' && github.event.schedule == '17 0-15 * * *'))))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      changed: ${{ steps.decision.outputs.changed }}
      publish: ${{ steps.decision.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; official ref verified 2026-10-20
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; official ref verified 2026-10-20
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Check free storage headroom before any source request
        run: node scripts/artifact-budget.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Admit one scheduled attempt within the approved window
        if: github.event_name == 'schedule' && vars.DATA_SCHEDULE_MODE == 'd4'
        id: d4
        run: node scripts/d4-acceptance.mjs admit
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Persist single-use claim before restoring or updating any source
        if: github.event_name == 'schedule' && vars.DATA_SCHEDULE_MODE == 'd4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.d4.outputs.claim_name }}
          path: .cache/d4/claim.json
          retention-days: 7
          if-no-files-found: error
      - name: Authorize explicit first manifest before restore or source requests
        if: github.event_name == 'workflow_dispatch' && (inputs.initialize_manifest == true || inputs.baseline_approval != '')
        run: node scripts/authorize-release-baseline.mjs
      - name: Restore last successful checkpoint (fail closed if missing)
        id: restore
        run: node scripts/automation-state.mjs restore
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INITIALIZE_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_state == true && 'true' || 'false' }}
          CHECKPOINT_ONLY: ${{ inputs.source == 'checkpoint' }}
          APPROVED_CHECKPOINT_RUN: ${{ inputs.checkpoint_run }}
          PUBLISH_CURRENT: ${{ inputs.publish_current }}
          PUBLISH_ENABLED: ${{ vars.DATA_PUBLISH_ENABLED }}
          DEPLOY_TARGET: ${{ vars.DATA_DEPLOY_TARGET }}
      - name: Capture restored source state for independent acceptance
        if: github.event_name == 'schedule' && vars.DATA_SCHEDULE_MODE == 'd4'
        run: node scripts/d4-acceptance.mjs capture
      - name: Isolated source updates
        if: inputs.source != 'checkpoint'
        id: refresh
        shell: bash
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set +e
          if [ "$EVENT" = "schedule" ]; then
            npm run update:data -- --sources=core --scheduled
          elif [ "$SOURCE" = "all" ]; then
            npm run update:data
          else
            npm run update:data -- "--sources=$SOURCE"
          fi
          code=$?
          if [ "$code" = 2 ]; then
            echo "::warning::One or more sources failed; valid previous snapshots preserved. See the safe summary."
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
      - name: Preserve source acceptance evidence
        if: github.event_name == 'schedule' && vars.DATA_SCHEDULE_MODE == 'd4'
        run: node scripts/d4-acceptance.mjs evidence
      - name: Upload bounded acceptance evidence
        if: github.event_name == 'schedule' && vars.DATA_SCHEDULE_MODE == 'd4'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dailyinfo-d4-evidence
          path: .cache/d4/evidence.json
          retention-days: 1
          if-no-files-found: error
      - name: Verify every public snapshot
        run: npm run verify:data
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      - id: decision
        env:
          DATA_CHANGED: ${{ steps.refresh.outputs.changed }}
          CODE_CHANGED: ${{ steps.restore.outputs.code_changed }}
          FORCE_BUILD: ${{ inputs.publish_current }}
          EVENT: ${{ github.event_name }}
          AUTO_PUBLISH_ENABLED: ${{ vars.DATA_SCHEDULE_MODE == 'continuous' && vars.DATA_AUTO_PUBLISH_ENABLED || 'false' }}
          FREE_USAGE_CONFIRMED: ${{ vars.DATA_FREE_USAGE_CONFIRMED }}
          PUBLISH_ENABLED: ${{ vars.DATA_PUBLISH_ENABLED }}
          DEPLOY_TARGET: ${{ vars.DATA_DEPLOY_TARGET }}
        run: node scripts/release-decision.mjs
      - name: Test and build only a changed release candidate (no CWA secret in build environment)
        if: steps.decision.outputs.changed == 'true'
        run: |
          npm test
          npm run build -- --base=/dailyinfo/
      - name: Verify built output before uploading
        if: steps.decision.outputs.changed == 'true'
        run: npm run verify -- --dist
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      - name: Guard production baseline and seal release manifest
        if: steps.decision.outputs.publish == 'true'
        run: |
          node scripts/publish-guard.mjs
          npm run verify -- --dist
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare validated checkpoint
        run: node scripts/automation-state.mjs export
      - name: Bound checkpoint and build uploads
        run: node scripts/artifact-budget.mjs --upload
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_BUILD: ${{ steps.decision.outputs.changed }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; official ref verified 2026-10-20
        with:
          name: dailyinfo-state-candidate
          path: .cache/data-state/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; official ref verified 2026-10-20
        if: steps.decision.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: dailyinfo-site-preview
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3; official ref verified 2026-10-20
        if: steps.decision.outputs.publish == 'true'
        with:
          path: dist/
          retention-days: 1

  deploy:
    needs: update
    if: (github.event_name != 'schedule' || (vars.DATA_SCHEDULE_MODE == 'continuous' && vars.DATA_AUTOMATION_ENABLED == 'true' && vars.DATA_SCHEDULE_ENABLED == 'true' && vars.DATA_FREE_USAGE_CONFIRMED == 'true' && vars.DATA_AUTO_PUBLISH_ENABLED == 'true')) && needs.update.outputs.publish == 'true' && vars.DATA_PUBLISH_ENABLED == 'true' && vars.DATA_DEPLOY_TARGET == 'pages'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4; official ref verified 2026-10-20

  checkpoint:
    needs: [update, deploy]
    # Never advance the persistent checkpoint after a failed build or deployment.
    if: always() && needs.update.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; official ref verified 2026-10-20
        with:
          name: dailyinfo-state-candidate
          path: checkpoint/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; official ref verified 2026-10-20
        with:
          name: dailyinfo-data-state
          path: checkpoint/
          retention-days: 7
          if-no-files-found: error
      - name: Summarize workflow and deployment outcomes
        if: always()
        env:
          UPDATE_RESULT: ${{ needs.update.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CHECKPOINT_RESULT: ${{ job.status }}
        run: |
          printf '## Workflow outcomes\n\n- update: %s\n- deploy: %s\n- checkpoint job: %s\n\nSource results are listed separately; workflow success does not imply every source changed or was published.\n' "$UPDATE_RESULT" "$DEPLOY_RESULT" "$CHECKPOINT_RESULT" >> "$GITHUB_STEP_SUMMARY"

  d4-acceptance:
    needs: [update, deploy, checkpoint]
    if: always() && github.event.repository.visibility == 'public' && github.event_name == 'schedule' && vars.DATA_SCHEDULE_MODE == 'd4' && github.event.schedule == '43 12 * * *' && vars.DATA_D4_ONCE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Independent final PASS or FAIL (never publish or retry)
        run: node scripts/d4-acceptance.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_RESULT: ${{ needs.update.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CHECKPOINT_RESULT: ${{ needs.checkpoint.result }}
